<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website Saya</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 50px 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #6b7280;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .status {
      display: inline-block;
      padding: 12px 22px;
      background: #ecfdf5;
      color: #047857;
      border-radius: 999px;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Website Aktif 🚀</h1>

    <p>
      Selamat datang di website saya.
      Website ini berhasil dijalankan menggunakan Railway.
    </p>

    <div class="status">
      ● Server Online
    </div>

    <footer>
      © 2026 Website Saya
    </footer>

  </div>

</body>
</html>
